[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
  "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts",
]
solc_version = "0.8.19"
evm_version = "london"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false

[rpc_endpoints]
botchain_testnet = "https://rpc.bohr.life"
botchain_mainnet = "https://rpc.botchain.ai"

[etherscan]
botchain_testnet = { key = "", url = "https://scan.bohr.life/api" }
botchain_mainnet = { key = "", url = "https://scan.botchain.ai/api" }

[fmt]
line_length = 120
wrap_comments = true
